name: Backtest

# Replays every season since 1999, week by week, with grades rebuilt from each
# season's earlier games only, and grades every pick tier against the closing
# line. Then the rule check (scripts/rule_check.py) flags any rule that's
# slipping and searches for new rules that hold up on seasons they weren't
# picked on, and opens a GitHub issue if anything changed. Nothing on the site
# changes automatically. Research only: results go in the run summary,
# data/backtest.json and data/rule_check.md. Runs Tuesday mornings, on pull
# requests that change the model, and by hand.
on:
  schedule:
    - cron: "0 14 * * 2"   # Tuesday 9 AM Central
  workflow_dispatch:
  pull_request:
    paths:
      - "nfl_edge/**"
      - "scripts/backtest.py"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('backtest-{0}', github.ref) || 'data-update' }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Replay every season against the closing line
        run: |
          python scripts/backtest.py --first 1999 --current --json data/backtest.json --games replay.json | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Rule check (flag slipping rules, look for better ones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/rule_check.py --games replay.json ${{ github.event_name != 'pull_request' && '--issue' || '' }} > /dev/null
          cat data/rule_check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the results
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/commit-data.sh "Update backtest"
