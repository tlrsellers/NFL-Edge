name: Update grades

# Rebuilds the 0-10 team grades from this season's play-by-play (nflverse, free).
# nflverse posts each game's plays within about a day. Times are UTC; Central is
# 5 hours behind until early November, then 6.
on:
  schedule:
    - cron: "0 11 * * 1"   # Monday 6 AM Central, after Sunday's games
    - cron: "0 11 * * 2"   # Tuesday 6 AM Central, after Monday night
    - cron: "0 11 * * 5"   # Friday 6 AM Central, after Thursday night
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the website deploy after committing

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  grades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build grades from nflverse
        run: python -m nfl_edge.build
      - name: Commit updated grades
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/commit-data.sh "Update grades"
